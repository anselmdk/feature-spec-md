name: Mock feature spec report PR comment

on:
  workflow_run:
    workflows: [Mock feature spec reports]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    steps:
      - name: Update mock report comment
        uses: actions/github-script@v8
        env:
          REPORT_BASE_URL: ${{ vars.FEATURE_SPEC_REPORT_BASE_URL }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const marker = '<!-- feature-spec-md-mock-reports -->';
            const statePrefix = '<!-- feature-spec-md-mock-report-state:';
            const baseUrl = process.env.REPORT_BASE_URL.replace(/\/+$/, '');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            const urlsForBuild = (buildNumber) => {
              const buildUrl = baseUrl + '/build/' + buildNumber;
              return {
                indexUrl: buildUrl + '/',
                currentUrl: buildUrl + '/feature-spec-report/',
                previousUrl: buildUrl + '/previous-feature-spec-report/',
                diffUrl: buildUrl + '/diff-report/',
              };
            };
            const decodeState = (body) => {
              const match = body?.match(/<!-- feature-spec-md-mock-report-state:([A-Za-z0-9+/=]+) -->/);
              if (!match) return undefined;
              try {
                return JSON.parse(Buffer.from(match[1], 'base64').toString('utf8'));
              } catch {
                return undefined;
              }
            };
            const legacyEntry = (comment) => {
              const buildNumber = comment?.body?.match(/\/build\/(\d+)\//)?.[1];
              if (!buildNumber) return undefined;
              const runUrl = comment.body.match(/Generated by \[workflow run \d+\]\(([^)]+)\)/)?.[1] ?? '';
              return {
                buildNumber,
                timestamp: comment.updated_at,
                runUrl,
                ...urlsForBuild(buildNumber),
              };
            };
            const previousState = decodeState(previous?.body);
            const priorEntries = previousState
              ? [previousState.current, ...(previousState.history ?? [])].filter(Boolean)
              : [legacyEntry(previous)].filter(Boolean);
            const current = {
              buildNumber: process.env.BUILD_NUMBER,
              timestamp: new Date().toISOString(),
              runUrl: process.env.RUN_URL,
              ...urlsForBuild(process.env.BUILD_NUMBER),
            };
            const history = priorEntries
              .filter((entry) => entry.buildNumber !== current.buildNumber)
              .slice(0, 30);
            const state = Buffer.from(
              JSON.stringify({ current, history }),
              'utf8',
            ).toString('base64');
            const formatDate = (value) =>
              new Intl.DateTimeFormat('en-GB', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                timeZone: 'UTC',
                timeZoneName: 'short',
              }).format(new Date(value));
            const historyLines = history.map((entry) =>
              '- Build [' + entry.buildNumber + '](' + (entry.runUrl || entry.indexUrl) + ')' +
              ' · ' + formatDate(entry.timestamp) +
              ' · [index](' + entry.indexUrl + ')' +
              ' · [current](' + entry.currentUrl + ')' +
              ' · [previous](' + entry.previousUrl + ')' +
              ' · [diff](' + entry.diffUrl + ')'
            );
            const lines = [
              marker,
              statePrefix + state + ' -->',
              '## Mock feature spec reports',
              '',
              '[Report index](' + current.indexUrl + ') · ' +
                '[Current report](' + current.currentUrl + ') · ' +
                '[Previous report](' + current.previousUrl + ') · ' +
                '[Diff report](' + current.diffUrl + ')',
              '',
              'Build [' + current.buildNumber + '](' + current.runUrl + ')' +
                ' · ' + formatDate(current.timestamp),
            ];
            if (historyLines.length) {
              lines.push(
                '',
                '<details>',
                '<summary>Previous reports (' + historyLines.length + ')</summary>',
                '',
                ...historyLines,
                '',
                '</details>',
              );
            }
            const body = lines.join('\n');
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body,
              });
            }
