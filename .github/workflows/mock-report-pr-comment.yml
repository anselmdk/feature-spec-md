name: Mock feature spec report PR comment

on:
  workflow_run:
    workflows: [Mock feature spec reports]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    steps:
      - name: Update mock report comment
        uses: actions/github-script@v8
        env:
          REPORT_BASE_URL: ${{ vars.FEATURE_SPEC_REPORT_BASE_URL }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const marker = '<!-- feature-spec-md-mock-reports -->';
            const baseUrl = process.env.REPORT_BASE_URL.replace(/\/+$/, '');
            const buildUrl = baseUrl + '/build/' + process.env.BUILD_NUMBER;
            const body = [
              marker,
              '## Mock feature spec reports',
              '',
              '[Report index](' + buildUrl + '/) · ' +
                '[Current report](' + buildUrl + '/feature-spec-report/) · ' +
                '[Previous report](' + buildUrl + '/previous-feature-spec-report/) · ' +
                '[Diff report](' + buildUrl + '/diff-report/)',
              '',
              'Generated by [workflow run ' + process.env.BUILD_NUMBER + '](' +
                process.env.RUN_URL + ').',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body,
              });
            }
