# Reusable FTP storage diagnostic and cleanup workflow for consuming projects.
# The report mode is read-only. Cleanup additionally requires confirm=true.

name: Consuming project feature spec FTP maintenance

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to install the consuming project's dependencies.
        required: false
        type: string
        default: "24"
      mode:
        description: smoke-test, report, dry-run, or cleanup
        required: false
        type: string
        default: report
      keep-builds:
        description: Number of newest numbered build directories to retain.
        required: false
        type: string
        default: "100"
      max-builds-to-scan:
        description: Optional limit on newest numbered builds scanned by report mode.
        required: false
        type: string
        default: ""
      max-builds-to-delete:
        description: Maximum expired build directories removed by one retention cleanup run.
        required: false
        type: string
        default: "10"
      paths:
        description: Comma-separated paths relative to the configured FTP root.
        required: false
        type: string
        default: ""
      pr-number:
        description: Closed pull request whose full and diff report directories should be removed.
        required: false
        type: string
        default: ""
      confirm:
        description: Required true for destructive cleanup mode.
        required: false
        type: boolean
        default: false
      ftp-host:
        required: true
        type: string
      ftp-user:
        required: true
        type: string
      ftp-remote-dir:
        required: false
        type: string
        default: ""
      ftp-port:
        required: false
        type: string
        default: ""
      ftp-secure:
        required: false
        type: boolean
        default: true
    secrets:
      ftp-password:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  maintain:
    if: inputs.mode != 'cleanup' || inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FEATURE_SPEC_FTP_HOST: ${{ inputs.ftp-host }}
      FEATURE_SPEC_FTP_USER: ${{ inputs.ftp-user }}
      FEATURE_SPEC_FTP_PASSWORD: ${{ secrets.ftp-password }}
      FEATURE_SPEC_FTP_REMOTE_DIR: ${{ inputs.ftp-remote-dir }}
      FEATURE_SPEC_FTP_PORT: ${{ inputs.ftp-port }}
      FEATURE_SPEC_FTP_SECURE: ${{ inputs.ftp-secure }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install consuming project dependencies
        run: npm ci
      - name: Resolve cleanup paths
        if: inputs.mode == 'cleanup'
        id: cleanup_paths
        uses: actions/github-script@v8
        env:
          INPUT_PATHS: ${{ inputs.paths }}
          PR_NUMBER: ${{ inputs.pr-number }}
        with:
          script: |
            const paths = new Set(
              (process.env.INPUT_PATHS || '').split(',').map((path) => path.trim()).filter(Boolean),
            );
            const prNumber = process.env.PR_NUMBER;
            if (prNumber) {
              if (!/^\d+$/.test(prNumber)) {
                core.setFailed('pr-number must be a positive integer.');
                return;
              }
              paths.add(`pr/${prNumber}`);
              const marker = '<!-- feature-spec-md-pr-diff -->';
              const statePattern = /<!-- feature-spec-md-report-state:([A-Za-z0-9+/=]+) -->/;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(prNumber),
              });
              const comment = comments.find((item) =>
                item.user?.type === 'Bot' && item.body?.includes(marker),
              );
              const stateMatch = comment?.body?.match(statePattern);
              if (stateMatch) {
                try {
                  const state = JSON.parse(Buffer.from(stateMatch[1], 'base64').toString('utf8'));
                  for (const entry of [state.current, ...(state.history ?? [])]) {
                    const buildNumber = String(entry?.buildNumber ?? '');
                    if (/^\d+$/.test(buildNumber)) paths.add(`build/${buildNumber}`);
                  }
                } catch (error) {
                  core.warning(`Could not decode feature-spec report state for PR #${prNumber}: ${error}`);
                }
              }
            }
            core.setOutput('paths', [...paths].join(','));
      - name: Inspect or clean FTP storage
        if: inputs.mode != 'smoke-test'
        id: maintain
        run: >-
          npx --no-install feature-spec-md github-ftp-maintenance
          --mode "${{ inputs.mode }}"
          --keep-builds "${{ inputs.keep-builds }}"
          --max-builds-to-scan "${{ inputs.max-builds-to-scan }}"
          --max-builds-to-delete "${{ inputs.max-builds-to-delete }}"
          --paths "${{ steps.cleanup_paths.outputs.paths || inputs.paths }}"
          --ftp-maintenance-concurrency "16"
          --ftp-maintenance-connect-timeout "10"
          --ftp-maintenance-max-time "20"

      - name: Mark deleted report links in pull-request comments
        if: inputs.mode == 'cleanup' && steps.maintain.outputs.ftp-cleanup-paths != '[]'
        uses: actions/github-script@v8
        env:
          CLEANUP_PATHS: ${{ steps.maintain.outputs.ftp-cleanup-paths }}
        with:
          script: |
            const cleanupPaths = JSON.parse(process.env.CLEANUP_PATHS);
            const deletedBuilds = new Set(
              cleanupPaths
                .map((path) => path.match(/(?:^|\/)build\/(\d+)(?:\/|$)/)?.[1])
                .filter(Boolean),
            );
            const deletedPullRequestReports = new Set(
              cleanupPaths
                .map((path) => {
                  const match = path.match(/(?:^|\/)pr\/(\d+)\/(\d+)(?:\/|$)/);
                  return match ? `${match[1]}/${match[2]}` : undefined;
                })
                .filter(Boolean),
            );
            const deletedPullRequests = new Set(
              cleanupPaths
                .map((path) => path.match(/(?:^|\/)pr\/(\d+)(?:\/)?$/)?.[1])
                .filter(Boolean),
            );
            if (!deletedBuilds.size && !deletedPullRequestReports.size && !deletedPullRequests.size) return;

            const marker = '<!-- feature-spec-md-pr-diff -->';
            const statePattern = /<!-- feature-spec-md-report-state:([A-Za-z0-9+/=]+) -->/;
            const updateBody = (body) => {
              let next = body.replace(/~~~~(\[[^\]]+\]\([^)]+\))~~~~/g, '~~$1~~');
              next = next.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, label, url, offset, source) => {
                const build = url.match(/\/build\/(\d+)(?:\/|$)/)?.[1];
                const prReport = url.match(/\/pr\/(\d+)\/(\d+)(?:\/|$)/);
                const deleted =
                  (build && deletedBuilds.has(build)) ||
                  (prReport &&
                    (deletedPullRequests.has(prReport[1]) ||
                      deletedPullRequestReports.has(`${prReport[1]}/${prReport[2]}`)));
                const alreadyStruck =
                  source.slice(Math.max(0, offset - 2), offset) === '~~' &&
                  source.slice(offset + match.length, offset + match.length + 2) === '~~';
                return deleted && !alreadyStruck ? `~~[${label}](${url})~~` : match;
              });
              next = next.split('\n').map((line) => {
                const hasDeletedLink = line.includes('~~[') && /\/(?:build\/\d+|pr\/\d+\/\d+)(?:\/|\))/.test(line);
                return hasDeletedLink && !line.includes('deleted by cleanup job')
                  ? `${line} *(deleted by cleanup job)*`
                  : line;
              }).join('\n');
              const stateMatch = next.match(statePattern);
              if (!stateMatch) return next;
              try {
                const state = JSON.parse(Buffer.from(stateMatch[1], 'base64').toString('utf8'));
                for (const entry of [state.current, ...(state.history ?? [])]) {
                  if (entry && deletedBuilds.has(String(entry.buildNumber))) entry.deleted = true;
                }
                const encoded = Buffer.from(JSON.stringify(state), 'utf8').toString('base64');
                return next.replace(statePattern, `<!-- feature-spec-md-report-state:${encoded} -->`);
              } catch {
                return next;
              }
            };

            const affectedPullRequests = new Set([
              ...deletedPullRequests,
              ...[...deletedPullRequestReports].map((report) => report.split('/')[0]),
            ]);
            const pulls = [...affectedPullRequests].map((number) => ({ number: Number(number) }));
            for (const pull of pulls) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
              });
              const comment = comments.find((item) =>
                item.user?.type === 'Bot' && item.body?.includes(marker),
              );
              if (!comment) continue;
              const body = updateBody(comment.body);
              if (body !== comment.body) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                  body,
                });
              }
            }

      - name: Smoke test FTP storage maintenance
        if: inputs.mode == 'smoke-test'
        run: >-
          npx --no-install feature-spec-md github-ftp-maintenance
          --mode "smoke-test"
          --ftp-maintenance-concurrency "1"
          --ftp-maintenance-connect-timeout "5"
          --ftp-maintenance-max-time "10"

  refuse-unconfirmed-cleanup:
    if: inputs.mode == 'cleanup' && !inputs.confirm
    runs-on: ubuntu-latest
    steps:
      - run: >-
          echo "Cleanup was requested without confirm=true; no FTP changes were made." && exit 1
