# Reusable workflow for consuming projects.
#
# This workflow is intentionally stored in the library repository so projects that
# use @anselmdk/feature-spec-md do not have to copy the full PR diff report and
# PR comment implementation into their own repositories.
#
# GitHub only allows reusable workflows to be referenced from files directly under
# `.github/workflows`, so this cannot live in a subdirectory even though it is
# conceptually part of the public consuming-project API.
#
# Usage from a consuming project:
#
# jobs:
#   diff-report:
#     uses: anselmdk/feature-spec-md/.github/workflows/consuming-project-feature-spec-pr-diff-report.yml@main
#     secrets: inherit

name: Consuming project feature spec PR diff report

on:
  workflow_call:
    inputs:
      pr-number:
        description: Consuming project pull request number. Optional when called from a workflow_run event.
        required: false
        type: string
        default: ""
      ci-workflow-id:
        description: Consuming project workflow file name or ID used to find successful PR builds during manual dispatch.
        required: false
        type: string
        default: ci.yml
      node-version:
        description: Node.js version to use in the consuming project.
        required: false
        type: string
        default: "24"
      install-command:
        description: Dependency install command to run in the consuming project.
        required: false
        type: string
        default: npm install
      relevant-paths-pattern:
        description: JavaScript regular expression string for consuming-project changed files that should trigger a diff report.
        required: false
        type: string
        default: "^(src|specs|tests|scripts|public)/|^package(-lock)?\\.json$|^vite\\.config\\.|^playwright\\.config\\.|^tsconfig.*\\.json$|\\.(model|feature|stack|design)\\.md$"
      report-time-zone:
        description: IANA time zone for the server-rendered report timestamp fallback. Viewer browsers localize the timestamp when supported.
        required: false
        type: string
        default: Europe/Copenhagen

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  diff-report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0]
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check whether consuming project code or specs changed
        id: changes
        uses: actions/github-script@v8
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr-number }}
          RELEVANT_PATHS_PATTERN: ${{ inputs.relevant-paths-pattern }}
        with:
          script: |
            const prNumber = process.env.INPUT_PR_NUMBER
              ? Number(process.env.INPUT_PR_NUMBER)
              : context.payload.workflow_run?.pull_requests?.[0]?.number;
            if (!prNumber) {
              core.setFailed('No pull request number was provided and none could be inferred from the workflow_run event.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const relevantPattern = new RegExp(process.env.RELEVANT_PATHS_PATTERN);
            const relevant = files.some((file) => relevantPattern.test(file.filename));
            core.setOutput('changed', relevant ? 'true' : 'false');
            core.setOutput('pr-number', String(prNumber));
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('head-ref', pr.head.ref);
            core.setOutput('started-at', String(Date.now()));

      - name: Resolve current consuming project PR build
        id: current_build
        if: steps.changes.outputs.changed == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        uses: actions/github-script@v8
        env:
          CI_WORKFLOW_ID: ${{ inputs.ci-workflow-id }}
        with:
          script: |
            if (context.payload.workflow_run) {
              core.setOutput('build-number', String(context.payload.workflow_run.run_number));
              core.setOutput('run-url', context.payload.workflow_run.html_url);
              core.setOutput('workflow-id', String(context.payload.workflow_run.workflow_id));
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: process.env.CI_WORKFLOW_ID,
              status: 'success',
              head_sha: '${{ steps.changes.outputs.head-sha }}',
              per_page: 20,
            });
            const latest = runs.find((run) =>
              run.event === 'pull_request' || run.event === 'workflow_dispatch'
            );
            if (!latest) {
              core.setFailed('No successful CI build found for PR #${{ steps.changes.outputs.pr-number }} at ${{ steps.changes.outputs.head-sha }}.');
              return;
            }
            core.setOutput('build-number', String(latest.run_number));
            core.setOutput('run-url', latest.html_url);
            core.setOutput('workflow-id', String(latest.workflow_id));

      - name: Find latest consuming project main build
        id: main_build
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '${{ steps.current_build.outputs.workflow-id }}',
              branch: 'main',
              status: 'success',
              event: 'push',
              per_page: 20,
            });
            const currentBuildNumber = Number('${{ steps.current_build.outputs.build-number }}');
            const latest = runs.find((run) => run.run_number < currentBuildNumber);
            core.setOutput('build-number', latest ? String(latest.run_number) : '');

      - uses: actions/checkout@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          ref: ${{ steps.changes.outputs.head-sha }}

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install consuming project dependencies
        if: steps.changes.outputs.changed == 'true'
        run: ${{ inputs.install-command }}

      - name: Publish consuming project PR diff report
        id: diff_report
        if: steps.changes.outputs.changed == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: npx feature-spec-md github-diff-report --publish ftp
        env:
          FEATURE_SPEC_BUILD_NUMBER: ${{ steps.current_build.outputs.build-number }}
          FEATURE_SPEC_BASE_BUILD_NUMBER: ${{ steps.main_build.outputs.build-number }}
          FEATURE_SPEC_PR_NUMBER: ${{ steps.changes.outputs.pr-number }}
          FEATURE_SPEC_FTP_HOST: ${{ vars.FEATURE_SPEC_FTP_HOST }}
          FEATURE_SPEC_FTP_USER: ${{ vars.FEATURE_SPEC_FTP_USER }}
          FEATURE_SPEC_FTP_REMOTE_DIR: ${{ vars.FEATURE_SPEC_FTP_REMOTE_DIR }}
          FEATURE_SPEC_REPORT_BASE_URL: ${{ vars.FEATURE_SPEC_REPORT_BASE_URL }}
          FEATURE_SPEC_FTP_PASSWORD: ${{ secrets.FEATURE_SPEC_FTP_PASSWORD }}

      - name: Comment on consuming project PR
        if: always()
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.changes.outputs.pr-number || inputs.pr-number || github.event.workflow_run.pull_requests[0].number }}
          REPORT_BASE_URL: ${{ vars.FEATURE_SPEC_REPORT_BASE_URL }}
          DIFF_REPORT_URL: ${{ steps.diff_report.outputs.diff-report-url }}
          CURRENT_BUILD_NUMBER: ${{ steps.current_build.outputs.build-number || github.event.workflow_run.run_number }}
          BASE_BUILD_NUMBER: ${{ steps.main_build.outputs.build-number }}
          CURRENT_RUN_URL: ${{ steps.current_build.outputs.run-url || github.event.workflow_run.html_url }}
          REPORT_STARTED_AT: ${{ steps.changes.outputs.started-at }}
          REPORT_TIME_ZONE: ${{ inputs.report-time-zone }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          REPORT_OUTCOME: ${{ steps.diff_report.outcome }}
          RELEVANT_CHANGES: ${{ steps.changes.outputs.changed }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- feature-spec-md-pr-diff -->';
            const statePrefix = '<!-- feature-spec-md-report-state:';
            const buildNumber = process.env.CURRENT_BUILD_NUMBER || 'n/a';
            const baseBuildNumber = process.env.BASE_BUILD_NUMBER;
            const timestamp = new Date().toISOString();
            const runUrl = process.env.CURRENT_RUN_URL;
            const diffUrl = process.env.DIFF_REPORT_URL || '';
            const startedAt = Number(process.env.REPORT_STARTED_AT);
            const durationMinutes = Number.isFinite(startedAt)
              ? ((Date.now() - startedAt) / 60000).toFixed(1)
              : 'n/a';
            const reportBaseUrl = (process.env.REPORT_BASE_URL || '').replace(/\/+$/, '');
            const specUrl = reportBaseUrl + '/build/' + buildNumber + '/';
            const failed = process.env.WORKFLOW_CONCLUSION !== 'success' || process.env.REPORT_OUTCOME === 'failure';
            const relevant = process.env.RELEVANT_CHANGES === 'true';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            const decodeState = (body) => {
              const match = body?.match(/<!-- feature-spec-md-report-state:([A-Za-z0-9+/=]+) -->/);
              if (!match) return undefined;
              try {
                return JSON.parse(Buffer.from(match[1], 'base64').toString('utf8'));
              } catch {
                return undefined;
              }
            };
            const legacyEntries = (body) => {
              const entries = [];
              const pattern = /### PR build (\d+) - ([^\n]+)[\s\S]*?\[Open the diff report\]\(([^)]+)\)/g;
              for (const match of body?.matchAll(pattern) ?? []) {
                entries.push({
                  buildNumber: match[1],
                  baseBuildNumber: '',
                  timestamp: match[2],
                  runUrl: '',
                  diffUrl: match[3],
                  specUrl: reportBaseUrl + '/build/' + match[1] + '/',
                  durationMinutes: 'n/a',
                });
              }
              return entries;
            };
            const previousState = decodeState(previous?.body);
            const priorEntries = previousState
              ? [previousState.current, ...(previousState.history ?? [])].filter(Boolean)
              : legacyEntries(previous?.body);
            const current = {
              buildNumber,
              baseBuildNumber,
              timestamp,
              runUrl,
              diffUrl,
              specUrl,
              durationMinutes,
              status: failed ? 'failure' : relevant ? 'success' : 'skipped',
            };
            const history = priorEntries
              .filter((entry) => entry.buildNumber !== buildNumber)
              .slice(0, 30);
            const state = Buffer.from(
              JSON.stringify({ current, history }),
              'utf8',
            ).toString('base64');
            const formatDate = (value, timeZone) =>
              new Intl.DateTimeFormat('en-GB', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                timeZone,
                timeZoneName: 'short',
              }).format(new Date(value));
            const timeZone = process.env.REPORT_TIME_ZONE || 'Europe/Copenhagen';
            const localizedDate = (value) =>
              '<relative-time datetime="' + value + '" format="datetime">' +
              formatDate(value, timeZone) +
              '</relative-time>';
            const comparison = (entry) =>
              entry.baseBuildNumber
                ? ' compared with main build ' + entry.baseBuildNumber
                : '';
            const historyLines = history.map((entry) =>
              '- ' + (entry.status === 'failure' ? '<span style="color: #cf222e">❌ Failed</span>' : entry.status === 'skipped' ? '⏭️ Skipped' : '✅') + ' Build [' + entry.buildNumber + '](' + (entry.runUrl || entry.specUrl) + ')' +
              comparison(entry) + ' · ' + localizedDate(entry.timestamp) +
              ' · report job ' + (entry.durationMinutes ?? 'n/a') + ' minutes' +
              ' · [spec](' + entry.specUrl + ') · [diff](' + entry.diffUrl + ')'
            );
            const lines = [
              marker,
              statePrefix + state + ' -->',
              '## Feature spec reports',
              '',
              failed
                ? '<span style="color: #cf222e">❌ Feature spec report failed</span>'
                : relevant
                  ? '[Full spec report](' + specUrl + ') · [Changes since main](' + diffUrl + ')'
                  : '⏭️ No feature-spec changes detected; no report was generated.',
              '',
              (failed ? '<span style="color: #cf222e">❌</span> ' : '') + 'Build [' + buildNumber + '](' + runUrl + ')' + comparison(current) +
                ' · ' + localizedDate(timestamp) +
                ' · report job ' + durationMinutes + ' minutes',
            ];
            if (historyLines.length) {
              lines.push(
                '',
                '<details>',
                '<summary>Previous reports (' + historyLines.length + ')</summary>',
                '',
                ...historyLines,
                '',
                '</details>',
              );
            }
            const nextBody = lines.join('\n');
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: nextBody,
              });
            }
